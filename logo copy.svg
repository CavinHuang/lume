<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2b2b2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="90" ry="90" fill="url(#bgGradient)" filter="url(#dropShadow)" />

  <circle cx="256" cy="240" r="100" stroke="white" stroke-width="12" fill="white" />

  <path d="M 216 190 L 216 240 Q 216 280 256 280 Q 296 280 296 240 L 296 290" 
        stroke="#111111" 
        stroke-width="24" 
        stroke-linecap="round" 
        fill="none" />

  <text x="256" y="420" 
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="300" 
        font-size="64" 
        fill="white" 
        text-anchor="middle" 
        letter-spacing="2">Lume</text>
</svg>
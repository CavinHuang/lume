version: 1
agent: {}
providers: {}
models:
  embedding:
    defaultModelRef: local-onnx/Xenova/bge-small-zh-v1.5
mcp: {}
skills:
  enabled: []
  disabled: []
plugins:
  global:
    enabled: []
    disabled: []
  workspaces: {}
  directories: []
  marketSources:
    - id: official
      name: Lume Plugins
      kind: remote-index
      enabled: true
      url: https://github.com/CavinHuang/lume-plugins
      mirrorUrl: https://lume-plugin.mrhuang.site
permissions:
  toolPolicy:
    allow: []
    deny: []
  rules: []
  classifier:
    enabled: false
  privateWriteRoots: []
  approvals:
    desktop:
      enabled: true
    subagent:
      mode: ask-parent
      allowAlways: desktop-only
    im:
      enabled: true
      allowTextApprove: true
      allowAlways: desktop-only
      groupApproval: desktop-only
      accounts: {}
hooks:
  internal:
    enabled: true
    memory: true
    security: true
    observability: true
webSearch:
  strategy: priority
  providers:
    guanlan:
      enabled: false
    duckduckgo:
      enabled: false
    bing:
      enabled: true
lsp:
  enabled: true
  diagnosticsOnWrite: true
  diagnosticsDeduplicate: true
  formatOnWrite: false
  idleTimeoutMs: 600000
  useLspmux: auto
workspaces: {}

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lume Relay</title>
  <style>
    body { margin: 0; width: 320px; font-family: system-ui; color: #111827; background: #ffffff; }
    .wrap { padding: 12px; }
    .title { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .muted { color: #6b7280; font-size: 12px; line-height: 1.5; }
    .state { font-size: 12px; line-height: 1.55; white-space: pre-line; }
    .error { margin-top: 8px; color: #b91c1c; font-size: 12px; line-height: 1.45; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; background: #fff; cursor: pointer; font-size: 12px; }
    button.primary { background: #111827; color: #fff; border-color: #111827; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">Lume Browser Relay</p>
    <div class="card">
      <div id="state" class="state">加载中...</div>
      <div id="error" class="error" hidden></div>
      <p class="muted">提示：先确保 Lume sidecar relay 已启动，再连接当前标签页。</p>
    </div>
    <div class="actions">
      <button id="toggle" class="primary">连接当前标签页</button>
      <button id="options">设置</button>
      <button id="refresh">刷新</button>
    </div>
    <p id="retry" class="muted" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lume Browser Relay Settings</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 560px; margin: 0 auto; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-top: 14px; }
    label { display: block; margin: 10px 0 5px; font-size: 13px; color: #4b5563; }
    input { width: 180px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 8px 16px; }
    .hint { color: #4b5563; font-size: 13px; line-height: 1.45; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #status { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Lume Browser Relay</h2>
  <p class="hint">点击扩展图标可附加/解绑当前标签页。扩展模式要求本机 sidecar relay 可访问。</p>

  <div class="card">
    <label>Relay Port:</label>
    <input type="number" id="port" value="18792" min="1" max="65535">
    <label>Relay Token (optional):</label>
    <input type="text" id="token" placeholder="留空表示不使用 token">
    <button id="save">Save</button>
    <p class="hint">当前 relay 链接：<span class="mono" id="relay-url">http://127.0.0.1:18792/</span></p>
    <p id="status"></p>
  </div>

  <div class="card">
    <p class="hint">Chrome 安装路径：<span class="mono">chrome://extensions/</span>，开启 Developer mode 后使用 Load unpacked。</p>
  </div>

  <script src="options.js"></script>
</body>
</html>

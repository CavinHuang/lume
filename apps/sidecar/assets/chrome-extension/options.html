<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lume Browser Relay Settings</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 400px; }
    label { display: block; margin: 10px 0 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Lume Browser Relay</h2>
  <label>Relay Port:</label>
  <input type="number" id="port" value="18792" min="1" max="65535">
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>

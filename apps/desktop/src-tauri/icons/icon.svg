<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark indigo background -->
    <radialGradient id="bg" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1A1140"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>

    <!-- Left facets: deep burnt-orange → deep purple -->
    <linearGradient id="gLeft" gradientUnits="userSpaceOnUse"
      x1="142" y1="415" x2="298" y2="92">
      <stop offset="0%" stop-color="#A03200"/>
      <stop offset="100%" stop-color="#5A1DAF"/>
    </linearGradient>

    <!-- Right facets: slightly brighter orange → purple -->
    <linearGradient id="gRight" gradientUnits="userSpaceOnUse"
      x1="370" y1="415" x2="214" y2="92">
      <stop offset="0%" stop-color="#B83C00"/>
      <stop offset="100%" stop-color="#4D17A8"/>
    </linearGradient>

    <!-- Center kite — brightest face -->
    <linearGradient id="gCenter" gradientUnits="userSpaceOnUse"
      x1="256" y1="375" x2="256" y2="92">
      <stop offset="0%"   stop-color="#FFB020"/>
      <stop offset="42%"  stop-color="#FF2E7D"/>
      <stop offset="100%" stop-color="#8B4FFF"/>
    </linearGradient>

    <!-- Bottom triangle -->
    <linearGradient id="gBottom" gradientUnits="userSpaceOnUse"
      x1="256" y1="415" x2="256" y2="352">
      <stop offset="0%" stop-color="#6A1A96"/>
      <stop offset="100%" stop-color="#B022CC"/>
    </linearGradient>

    <!-- Ambient halo behind flame -->
    <filter id="halo" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow on center facet -->
    <filter id="faceGlow" x="-28%" y="-18%" width="156%" height="136%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tight tip glow -->
    <filter id="tipGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- ── Warm ambient halo ── -->
  <ellipse cx="256" cy="295" rx="145" ry="128"
           fill="#FF6000" opacity="0.09" filter="url(#halo)"/>

  <!--
    Flame key points
    ─────────────────────────────────
    T  = (256,  92)   top tip
    WL = (142, 278)   widest left
    WR = (370, 278)   widest right
    BL = (198, 415)   bottom left
    BR = (314, 415)   bottom right
    IL = (214, 260)   inner-left shoulder
    IR = (298, 260)   inner-right shoulder
    IC = (256, 375)   inner center (base of center kite)
  -->

  <!-- Left upper triangle  T → WL → IL -->
  <polygon points="256,92 142,278 214,260"
           fill="url(#gLeft)"/>

  <!-- Left lower quad  WL → BL → IC → IL -->
  <polygon points="142,278 198,415 256,375 214,260"
           fill="url(#gLeft)" opacity="0.82"/>

  <!-- Right upper triangle  T → IR → WR -->
  <polygon points="256,92 298,260 370,278"
           fill="url(#gRight)"/>

  <!-- Right lower quad  IR → IC → BR → WR -->
  <polygon points="298,260 256,375 314,415 370,278"
           fill="url(#gRight)" opacity="0.82"/>

  <!-- Bottom triangle  BL → BR → IC -->
  <polygon points="198,415 314,415 256,375"
           fill="url(#gBottom)"/>

  <!-- Center kite (front face, brightest)  T → IL → IC → IR -->
  <polygon points="256,92 214,260 256,375 298,260"
           fill="url(#gCenter)" filter="url(#faceGlow)"/>

  <!-- ── Facet edge highlights ── -->
  <g fill="none" stroke-linecap="round">
    <!-- Center kite edges — warm amber tint -->
    <line x1="256" y1="92"  x2="214" y2="260" stroke="rgba(255,200,100,0.30)" stroke-width="1.5"/>
    <line x1="256" y1="92"  x2="298" y2="260" stroke="rgba(255,200,100,0.30)" stroke-width="1.5"/>
    <!-- Horizontal shoulder line -->
    <line x1="214" y1="260" x2="298" y2="260" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <!-- Center lower edges — cool violet tint -->
    <line x1="214" y1="260" x2="256" y2="375" stroke="rgba(180,110,255,0.22)" stroke-width="1.5"/>
    <line x1="298" y1="260" x2="256" y2="375" stroke="rgba(180,110,255,0.22)" stroke-width="1.5"/>
    <!-- Outer rim to shoulder -->
    <line x1="142" y1="278" x2="214" y2="260" stroke="rgba(255,160,80,0.18)"  stroke-width="1.2"/>
    <line x1="370" y1="278" x2="298" y2="260" stroke="rgba(255,160,80,0.18)"  stroke-width="1.2"/>
    <!-- Bottom to IC -->
    <line x1="198" y1="415" x2="256" y2="375" stroke="rgba(160,80,220,0.18)"  stroke-width="1.2"/>
    <line x1="314" y1="415" x2="256" y2="375" stroke="rgba(160,80,220,0.18)"  stroke-width="1.2"/>
  </g>

  <!-- ── Tip sparkle ── -->
  <!-- Outer glow -->
  <circle cx="256" cy="94" r="18"
          fill="rgba(255,210,120,0.55)" filter="url(#tipGlow)"/>
  <!-- Inner bright dot -->
  <circle cx="256" cy="94" r="6"
          fill="rgba(255,245,210,0.95)"/>

  <!-- ── Base reflection glimmer ── -->
  <ellipse cx="256" cy="415" rx="52" ry="5"
           fill="rgba(180,80,255,0.18)"/>
</svg>

[package]
name = "lume"
version = "0.0.3"
description = "Lume desktop shell"
authors = ["Lume Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
webbrowser = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
lume-logger = { path = "../../../crates/lume-logger" }

[[bin]]
name = "Lume"
path = "src/main.rs"

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            rustTarget: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            rustTarget: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            args: ""
          - name: Linux
            os: ubuntu-22.04
            rustTarget: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rustTarget }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: |
          bun run --filter @lume/shared build
          bun run --filter @lume/ui build
          bun run --filter @lume/sidecar build
          bun run --filter @lume/web build

      - name: Prepare desktop bundle resources
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.platform.rustTarget }}
        run: |
          bun scripts/build-natives-binary.mjs
          bun scripts/build-sidecar-binary.mjs
          bun scripts/build-default-skills-archive.mjs

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUME_UPDATER_PUBLIC_KEY: ${{ vars.LUME_UPDATER_PUBLIC_KEY }}
          TAURI_TARGET_TRIPLE: ${{ matrix.platform.rustTarget }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Lume ${{ github.ref_name }}"
          releaseBody: "Desktop release for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true

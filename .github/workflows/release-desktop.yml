name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              if [ "$attempt" -eq 5 ]; then return 1; fi
              sleep "$((attempt * 3))"
            done
          }
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "Release workflow must run from a v* tag"; exit 1 ;;
          esac
          notes="docs/release/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' /tmp/release.json)" != "true" ]; then
              echo "Release ${GITHUB_REF_NAME} is already published"
              exit 1
            fi
            retry gh release edit "${GITHUB_REF_NAME}" --title "Lume ${GITHUB_REF_NAME}" --notes-file "$notes"
            retry gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | while read -r asset_name; do
              [ -z "$asset_name" ] || retry gh release delete-asset "${GITHUB_REF_NAME}" "$asset_name" --yes
            done
          else
            retry gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "Lume ${GITHUB_REF_NAME}" --notes-file "$notes"
          fi
          release_id="$(retry gh release view "${GITHUB_REF_NAME}" --json databaseId --jq '.databaseId')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-js-assets:
    name: Build JS assets
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.13-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun run --filter @lume/shared build
          bun run --filter @lume/ui build
          bun run --filter @lume/sidecar build
          bun run --filter @lume/cli build
          bun run --filter @lume/web build
      - name: Upload JS assets
        uses: actions/upload-artifact@v4
        with:
          name: js-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/web/dist
            apps/sidecar/dist
            packages/shared/dist
            packages/cli/dist

  build-macos:
    name: Build macOS
    needs: [prepare-release, build-js-assets]
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require macOS release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS release secret: $name"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/lume-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/lume-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\\(Developer ID Application:.*\\)"/\\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found"
            exit 1
          fi
          echo "LUME_COMPUTER_USE_CODESIGN_MODE=identity" >> "$GITHUB_ENV"
          echo "LUME_COMPUTER_USE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.13-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download JS assets
        uses: actions/download-artifact@v4
        with:
          name: js-assets
          path: .
      - name: Build native modules
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          bun scripts/build-natives-binary.mjs --target aarch64-apple-darwin
          bun scripts/build-natives-binary.mjs --target x86_64-apple-darwin
      - name: Prepare desktop bundle resources
        run: |
          bun run --filter @lume/desktop build:runtime
          bun scripts/build-sidecar-bundle.mjs
          bun scripts/build-default-skills-archive.mjs
          node scripts/build-node-repl-resources.mjs
          node scripts/build-desktop-host-resources.mjs --target aarch64-apple-darwin --require-stable-signing
          node scripts/build-desktop-host-resources.mjs --target x86_64-apple-darwin --require-stable-signing --preserve-manifest
      - name: Verify desktop package inputs
        run: bun scripts/verify-desktop-package-inputs.mjs
      - name: Build Electron package
        working-directory: apps/desktop
        env:
          LUME_RELEASE_SIGNING_REQUIRED: "1"
        run: node ./scripts/run-electron-builder.mjs --output-dir dist-release --mac --arm64 --x64 --publish never --config.directories.output=dist-release --config.mac.notarize=true
      - name: Notarize and staple release disks
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dmg in apps/desktop/dist-release/*.dmg; do
            found=1
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          if [ "$found" -ne 1 ]; then
            echo "Missing macOS DMG"
            exit 1
          fi
      - name: Smoke sidecar bundle
        run: bun scripts/smoke-sidecar-bundle.mjs
      - name: Verify package artifacts
        run: |
          LUME_DESKTOP_TARGET=aarch64-apple-darwin bun scripts/verify-desktop-package-artifacts.mjs
          LUME_DESKTOP_TARGET=x86_64-apple-darwin bun scripts/verify-desktop-package-artifacts.mjs
      - name: Verify Developer ID signature, Gatekeeper, and installed macOS app
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$(mktemp -d)"
          launch_app=""
          for dmg in apps/desktop/dist-release/*.dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet
            mounted_app="$(find "$mount_dir" -maxdepth 1 -name '*.app' | head -n 1)"
            copied_app="$app_dir/$(basename "$dmg" .dmg).app"
            ditto "$mounted_app" "$copied_app"
            hdiutil detach "$mount_dir" -quiet

            codesign --verify --deep --strict --verbose=2 "$copied_app"
            codesign -dv --verbose=4 "$copied_app" 2>&1 | grep -q "Authority=Developer ID Application"
            codesign -dv --verbose=4 "$copied_app" 2>&1 | grep -q "TeamIdentifier="
            spctl --assess --type execute --verbose=4 "$copied_app"
            if [[ "$dmg" == *arm64.dmg ]]; then
              launch_app="$copied_app"
            fi
          done

          if [ -z "$launch_app" ]; then
            echo "Missing arm64 app for launch smoke"
            exit 1
          fi
          log="$(mktemp)"
          LUME_DESKTOP_STARTUP_LOG="$log" "$launch_app/Contents/MacOS/Lume" &
          pid="$!"
          for _ in {1..90}; do
            if grep -q "sidecar ready" "$log"; then
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            sleep 1
          done
          cat "$log" || true
          kill "$pid" || true
          exit 1
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          upload_release_asset() {
            local asset="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber && return 0
              if [ "$attempt" -eq 5 ]; then return 1; fi
              sleep "$((attempt * 3))"
            done
          }
          while IFS= read -r -d '' asset; do
            upload_release_asset "$asset"
          done < <(find apps/desktop/dist-release -maxdepth 1 -type f ! -name builder-debug.yml -print0)

  build-windows:
    name: Build Windows
    needs: [prepare-release, build-js-assets]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require and prepare Windows release certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) { throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PFX_BASE64" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PASSWORD" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "lume-authenticode.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe not found" }
          "LUME_WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LUME_WINDOWS_CODESIGN_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LUME_WINDOWS_CODESIGN_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.13-
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download JS assets
        uses: actions/download-artifact@v4
        with:
          name: js-assets
          path: .
      - name: Build native modules
        run: |
          rustup target add x86_64-pc-windows-msvc
          bun scripts/build-natives-binary.mjs --target x86_64-pc-windows-msvc
      - name: Prepare desktop bundle resources
        run: |
          bun run --filter @lume/desktop build:runtime
          bun scripts/build-sidecar-bundle.mjs
          bun scripts/build-default-skills-archive.mjs
          node scripts/build-node-repl-resources.mjs
          node scripts/build-desktop-host-resources.mjs --require-stable-signing
      - name: Verify desktop package inputs
        run: bun scripts/verify-desktop-package-inputs.mjs
      - name: Build Electron package
        working-directory: apps/desktop
        run: node ./scripts/run-electron-builder.mjs --output-dir dist-release --win --x64 --publish never --config.directories.output=dist-release
      - name: Smoke sidecar bundle
        run: bun scripts/smoke-sidecar-bundle.mjs
      - name: Verify package artifacts
        run: bun scripts/verify-desktop-package-artifacts.mjs
      - name: Smoke installed Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist-release -Filter *.exe |
            Where-Object { $_.Name -notlike "*.blockmap" } |
            Select-Object -First 1
          if (-not $installer) { throw "Missing Windows installer" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Lume" } |
            Select-Object -First 1
          $candidates = @()
          if ($entry.InstallLocation) {
            $candidates += Join-Path $entry.InstallLocation "Lume.exe"
          }
          foreach ($root in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if ($root -and (Test-Path $root)) {
              $candidates += Get-ChildItem $root -Filter "Lume.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          }
          $app = $candidates |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-Item $_ } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $app) { throw "Installed Lume.exe not found" }
          if ((Get-AuthenticodeSignature $app.FullName).Status -ne "Valid") {
            throw "Installed Lume.exe does not have a valid Authenticode signature"
          }
          $desktopHost = Get-ChildItem $app.DirectoryName -Filter "lume_desktop_host.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $desktopHost -or (Get-AuthenticodeSignature $desktopHost.FullName).Status -ne "Valid") {
            throw "Packaged desktop host does not have a valid Authenticode signature"
          }
          $log = Join-Path $env:TEMP "lume-startup.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $env:LUME_DESKTOP_STARTUP_LOG = $log
          $proc = Start-Process -FilePath $app.FullName -PassThru
          try {
            for ($i = 0; $i -lt 90; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern "sidecar ready" -Quiet)) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                exit 0
              }
              Start-Sleep -Seconds 1
            }
            if (Test-Path $log) { Get-Content $log }
            throw "Installed app did not report sidecar ready"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $uninstaller = Get-ChildItem $app.DirectoryName -Filter "Uninstall*.exe" -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
            }
          }
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          function Invoke-ReleaseUpload([string]$AssetPath) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              gh release upload $env:GITHUB_REF_NAME $AssetPath --clobber
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -eq 5) { throw "Failed to upload release asset: $AssetPath" }
              Start-Sleep -Seconds ($attempt * 3)
            }
          }
          Get-ChildItem apps/desktop/dist-release -File |
            Where-Object { $_.Name -ne "builder-debug.yml" } |
            ForEach-Object { Invoke-ReleaseUpload $_.FullName }

  verify-release-assets:
    name: Verify Release Assets
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bun scripts/verify-release-assets.mjs

  publish-release:
    name: Publish Release
    needs: verify-release-assets
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Publishing release for tag ${{ github.ref_name }}"
          gh release edit "${{ github.ref_name }}" --draft=false

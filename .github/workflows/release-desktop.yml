name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "Release workflow must run from a v* tag"; exit 1 ;;
          esac
          notes="docs/release/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' /tmp/release.json)" != "true" ]; then
              echo "Release ${GITHUB_REF_NAME} is already published"
              exit 1
            fi
            gh release edit "${GITHUB_REF_NAME}" --title "Lume ${GITHUB_REF_NAME}" --notes-file "$notes"
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | while read -r asset_name; do
              [ -z "$asset_name" ] || gh release delete-asset "${GITHUB_REF_NAME}" "$asset_name" --yes
            done
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "Lume ${GITHUB_REF_NAME}" --notes-file "$notes"
          fi
          release_id="$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq '.databaseId')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-macos-arm:
    name: Build macOS ARM
    needs: prepare-release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun run --filter @lume/shared build
          bun run --filter @lume/ui build
          bun run --filter @lume/sidecar build
          bun run --filter @lume/cli build
          bun run --filter @lume/web build
      - name: Prepare desktop bundle resources
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          bun scripts/build-natives-binary.mjs
          bun scripts/build-sidecar-binary.mjs
          bun scripts/build-default-skills-archive.mjs
      - name: Verify desktop package inputs
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: bun scripts/verify-desktop-package-inputs.mjs
      - name: Smoke compiled sidecar
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: bun scripts/smoke-compiled-sidecar.mjs
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUME_UPDATER_PUBLIC_KEY: ${{ vars.LUME_UPDATER_PUBLIC_KEY }}
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
      - name: Verify package artifacts
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: bun scripts/verify-desktop-package-artifacts.mjs

  build-macos-intel:
    name: Build macOS Intel
    needs: prepare-release
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun run --filter @lume/shared build
          bun run --filter @lume/ui build
          bun run --filter @lume/sidecar build
          bun run --filter @lume/cli build
          bun run --filter @lume/web build
      - name: Prepare desktop bundle resources
        env:
          TAURI_TARGET_TRIPLE: x86_64-apple-darwin
        run: |
          bun scripts/build-natives-binary.mjs
          bun scripts/build-sidecar-binary.mjs
          bun scripts/build-default-skills-archive.mjs
      - name: Verify desktop package inputs
        env:
          TAURI_TARGET_TRIPLE: x86_64-apple-darwin
        run: bun scripts/verify-desktop-package-inputs.mjs
      - name: Smoke compiled sidecar
        env:
          TAURI_TARGET_TRIPLE: x86_64-apple-darwin
        run: bun scripts/smoke-compiled-sidecar.mjs
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUME_UPDATER_PUBLIC_KEY: ${{ vars.LUME_UPDATER_PUBLIC_KEY }}
          TAURI_TARGET_TRIPLE: x86_64-apple-darwin
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
      - name: Verify package artifacts
        env:
          TAURI_TARGET_TRIPLE: x86_64-apple-darwin
        run: bun scripts/verify-desktop-package-artifacts.mjs

  build-windows:
    name: Build Windows
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun run --filter @lume/shared build
          bun run --filter @lume/ui build
          bun run --filter @lume/sidecar build
          bun run --filter @lume/cli build
          bun run --filter @lume/web build
      - name: Prepare desktop bundle resources
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          bun scripts/build-natives-binary.mjs
          bun scripts/build-sidecar-binary.mjs
          bun scripts/build-default-skills-archive.mjs
      - name: Verify desktop package inputs
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bun scripts/verify-desktop-package-inputs.mjs
      - name: Smoke compiled sidecar
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bun scripts/smoke-compiled-sidecar.mjs
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUME_UPDATER_PUBLIC_KEY: ${{ vars.LUME_UPDATER_PUBLIC_KEY }}
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
      - name: Verify package artifacts
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bun scripts/verify-desktop-package-artifacts.mjs

  verify-release-assets:
    name: Verify Release Assets
    needs: [build-macos-arm, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bun scripts/verify-release-assets.mjs

  publish-release:
    name: Publish Release
    needs: verify-release-assets
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Publishing release for tag ${{ github.ref_name }}"
          gh release edit "${{ github.ref_name }}" --draft=false

name: PR Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core verification (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # 构建 natives 使 skipIf(!isNativeAvailable()) 门控的安全测试在 CI 真实执行
      # （shell 只读证明的 fail-closed 向量等，此前整块恒跳，#720 review 发现）
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lume-natives
      - name: Build natives
        run: bun run --filter @lume/natives build
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:core
      # 双态反向覆盖（#729 review 安全方向）：natives 就位后 fail-closed 回退
      # 块（bash.test.ts 反向门控）与 tokens JS 计数分支在主测试里恒跳，
      # 此处以空产物路径补跑
      - name: Unit tests (natives-absent fail-closed fallback)
        run: LUME_NATIVES_PATH=/nonexistent.node bun test packages/sdk/src/tools/bash.test.ts packages/sdk/src/utils/tokens.test.ts
      - name: Core smoke
        run: bun run test:smoke

  windows:
    name: Windows reliability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lume-natives
      - name: Build natives
        run: bun run --filter @lume/natives build
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: PowerShell, background process, Coding and scheduling tests
        run: bun run test:windows

  macos:
    name: macOS desktop reliability
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile Agent Island helper
        run: bun apps/desktop/scripts/build-agent-island-native.ts
      - name: Desktop typecheck
        run: bun run --filter @lume/desktop typecheck
      - name: Desktop and background process smoke
        run: |
          bun run --filter @lume/desktop test:smoke
          bun run --filter @lume/agent-sdk test:smoke

  # computer_use:
  #   name: Computer Use (${{ matrix.os }})
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       os: [windows-latest, macos-15]
  #   runs-on: ${{ matrix.os }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: oven-sh/setup-bun@v2
  #       with:
  #         bun-version: 1.3.13
  #     - name: Install dependencies
  #       run: bun install --frozen-lockfile
  #     - name: Verify Computer Use contracts and native host
  #       run: bun run verify:computer-use
  #     - name: Compile macOS Computer Use helpers
  #       if: runner.os == 'macOS'
  #       run: bun scripts/build-desktop-host-resources.mjs

  gate:
    name: PR gate
    if: always()
    needs: [core, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR verification job to pass
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          # COMPUTER_USE_RESULT: ${{ needs.computer_use.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$MACOS_RESULT" = "success"
          # test "$COMPUTER_USE_RESULT" = "success"

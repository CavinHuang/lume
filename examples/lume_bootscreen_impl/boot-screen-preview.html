<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lume 启动页 · 实现版</title>
<style>
:root {
  --bg: #11120f;
  --text: rgba(245,243,235,.94);
  --muted: rgba(230,226,214,.62);
  --line: rgba(217,225,202,.12);
  --chip: rgba(255,255,255,.04);
  --ease-main: cubic-bezier(.22, 1, .36, 1);
  --ease-soft: cubic-bezier(.33, 1, .68, 1);
  --shadow: 0 18px 60px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 40%, rgba(147,167,123,.10), transparent 28%),
    radial-gradient(circle at 50% 70%, rgba(255,255,255,.03), transparent 32%),
    var(--bg);
}
.boot-root {
  position: relative; width: 100%; height: 100%; isolation: isolate;
  background:
    radial-gradient(circle at 50% 38%, rgba(147,167,123,.05), transparent 22%),
    radial-gradient(circle at 50% 65%, rgba(255,255,255,.018), transparent 34%),
    linear-gradient(180deg, rgba(255,255,255,.012), rgba(255,255,255,0)),
    var(--bg);
  transition: background 1000ms var(--ease-soft);
}
.boot-screen { position: absolute; inset: 0; display: grid; place-items: center; }
.status-chip { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); z-index: 12; padding: 8px 12px; border-radius: 999px; font-size: 12px; letter-spacing: .02em; color: rgba(243,241,233,.78); background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(10px); transition: opacity 420ms var(--ease-main), transform 420ms var(--ease-main); }
.replay-btn { position: absolute; right: 28px; bottom: 28px; z-index: 12; height: 34px; padding: 0 14px; border: 1px solid rgba(217,225,202,.12); border-radius: 999px; background: rgba(255,255,255,.04); color: rgba(243,241,233,.82); font-size: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: .22s var(--ease-main); }
.replay-btn:hover { background: rgba(255,255,255,.07); transform: translateY(-1px); }
.soft-halo { position: absolute; width: 450px; height: 450px; border-radius: 50%; background: radial-gradient(circle at center, rgba(147,167,123,.18), rgba(147,167,123,.06) 42%, rgba(147,167,123,.02) 58%, transparent 76%); filter: blur(18px); z-index: 1; opacity: .84; transform: scale(.96); transition: opacity 980ms var(--ease-soft), transform 980ms var(--ease-soft), filter 980ms var(--ease-soft); }
.scene-layer { position: absolute; inset: 0; opacity: 0; transform: scale(.988) translateY(8px); transition: opacity 860ms var(--ease-main), transform 860ms var(--ease-main); pointer-events: none; z-index: 3; }
.scene-layer.active { opacity: 1; transform: scale(1) translateY(0); }
.center-shell { position: relative; z-index: 6; width: 250px; height: 250px; display: grid; place-items: center; transition: transform 900ms var(--ease-soft), filter 900ms var(--ease-soft); transform: translateY(0) scale(1); }
.mascot { width: 210px; height: auto; display: block; transform-origin: center bottom; filter: drop-shadow(0 18px 32px rgba(0,0,0,.20)); user-select: none; -webkit-user-drag: none; animation: mascotBreathe 2.8s ease-in-out infinite; }
.copy { position: absolute; top: calc(50% + 148px); left: 50%; transform: translateX(-50%); width: min(620px, 86vw); text-align: center; z-index: 8; transition: opacity 520ms var(--ease-main), transform 520ms var(--ease-main); }
.copy.is-fading, .status-chip.is-fading { opacity: 0; transform: translateX(-50%) translateY(8px); }
.title { font-size: 30px; line-height: 1.28; font-weight: 700; letter-spacing: .01em; margin-bottom: 12px; }
.subtitle { min-height: 26px; font-size: 14px; line-height: 1.8; color: var(--muted); }
.dots { margin-top: 22px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.dots span { width: 6px; height: 6px; border-radius: 999px; background: rgba(207,217,187,.72); animation: dotPulse 1.4s ease-in-out infinite; }
.dots span:nth-child(2) { animation-delay: .18s; } .dots span:nth-child(3) { animation-delay: .36s; }
.footer-hint { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); width: min(580px, 86vw); text-align: center; color: rgba(230,226,214,.42); font-size: 12px; line-height: 1.7; z-index: 9; transition: opacity 520ms var(--ease-main), transform 520ms var(--ease-main); }
.footer-hint.is-fading { opacity: 0; transform: translateX(-50%) translateY(6px); }
.stage-indicator { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 10px; }
.stage-indicator span { width: 6px; height: 6px; border-radius: 999px; background: rgba(207,217,187,.18); transition: all 360ms var(--ease-main); }
.stage-indicator span.active { width: 22px; border-radius: 999px; background: rgba(207,217,187,.72); }
.card-node { position: absolute; width: 96px; height: 64px; border-radius: 18px; opacity: 0; border: 1px solid rgba(217,225,202,.14); background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04)); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
.card-node::before { content: ""; position: absolute; left: 16px; top: 16px; width: 42px; height: 8px; border-radius: 999px; background: rgba(207,217,187,.38); }
.card-node::after { content: ""; position: absolute; left: 16px; top: 30px; width: 58px; height: 6px; border-radius: 999px; background: rgba(207,217,187,.18); }
.card-a { left: calc(50% - 272px); top: calc(50% - 110px); } .card-b { left: calc(50% + 176px); top: calc(50% - 116px); } .card-c { left: calc(50% - 232px); top: calc(50% + 90px); } .card-d { left: calc(50% + 184px); top: calc(50% + 94px); }
.scene-organize.active .card-a { animation: cardFlowA 3.6s var(--ease-soft) infinite; } .scene-organize.active .card-b { animation: cardFlowB 3.6s var(--ease-soft) infinite .22s; } .scene-organize.active .card-c { animation: cardFlowC 3.6s var(--ease-soft) infinite .48s; } .scene-organize.active .card-d { animation: cardFlowD 3.6s var(--ease-soft) infinite .72s; }
.memory-ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid rgba(147,167,123,.18); transform: translate(-50%, -50%); opacity: 0; }
.memory-ring.r1 { width: 260px; height: 260px; } .memory-ring.r2 { width: 324px; height: 324px; } .memory-ring.r3 { width: 390px; height: 390px; }
.memory-orb { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.9), rgba(147,167,123,.86)); box-shadow: 0 0 18px rgba(147,167,123,.35); opacity: 0; }
.orb-1 { left: calc(50% - 178px); top: calc(50% - 86px); } .orb-2 { left: calc(50% + 164px); top: calc(50% - 78px); } .orb-3 { left: calc(50% - 136px); top: calc(50% + 152px); } .orb-4 { left: calc(50% + 132px); top: calc(50% + 148px); }
.scene-memory.active .memory-ring.r1 { animation: ringPulse 3.0s var(--ease-soft) infinite; } .scene-memory.active .memory-ring.r2 { animation: ringPulse 3.0s var(--ease-soft) infinite .30s; } .scene-memory.active .memory-ring.r3 { animation: ringPulse 3.0s var(--ease-soft) infinite .60s; } .scene-memory.active .orb-1 { animation: orbMove1 3.5s var(--ease-soft) infinite; } .scene-memory.active .orb-2 { animation: orbMove2 3.5s var(--ease-soft) infinite .30s; } .scene-memory.active .orb-3 { animation: orbMove3 3.5s var(--ease-soft) infinite .60s; } .scene-memory.active .orb-4 { animation: orbMove4 3.5s var(--ease-soft) infinite .90s; }
.ready-ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid rgba(147,167,123,.32); transform: translate(-50%, -50%); opacity: 0; }
.ready-ring.r1 { width: 236px; height: 236px; } .ready-ring.r2 { width: 288px; height: 288px; } .ready-ring.r3 { width: 340px; height: 340px; }
.scene-ready.active .ready-ring.r1 { animation: readyPulse 2.6s var(--ease-soft) infinite; } .scene-ready.active .ready-ring.r2 { animation: readyPulse 2.6s var(--ease-soft) infinite .28s; } .scene-ready.active .ready-ring.r3 { animation: readyPulse 2.6s var(--ease-soft) infinite .56s; }
.boot-root[data-phase="awaken"] .soft-halo { opacity: .82; transform: scale(.96); } .boot-root[data-phase="organize"] .soft-halo { opacity: .92; transform: scale(1.03); } .boot-root[data-phase="memory"] .soft-halo { opacity: .96; transform: scale(1.08); } .boot-root[data-phase="ready"] .soft-halo { opacity: 1; transform: scale(1.12); }
.boot-root[data-phase="organize"] .center-shell { transform: translateY(-1px) scale(1.01); } .boot-root[data-phase="memory"] .center-shell { transform: translateY(-2px) scale(1.01); } .boot-root[data-phase="ready"] .center-shell { transform: translateY(-2px) scale(1.02); }
@keyframes mascotBreathe { 0%, 100% { transform: scale(.988); } 50% { transform: scale(1); } }
@keyframes dotPulse { 0%, 80%, 100% { opacity: .34; transform: scale(.82); } 40% { opacity: 1; transform: scale(1); } }
@keyframes cardFlowA { 0% { opacity: 0; transform: translate(0,0) scale(.82); } 18% { opacity: .85; } 62% { opacity: .94; transform: translate(156px,76px) scale(.99); } 100% { opacity: 0; transform: translate(184px,90px) scale(.92); } }
@keyframes cardFlowB { 0% { opacity: 0; transform: translate(0,0) scale(.82); } 18% { opacity: .85; } 62% { opacity: .94; transform: translate(-156px,82px) scale(.99); } 100% { opacity: 0; transform: translate(-184px,94px) scale(.92); } }
@keyframes cardFlowC { 0% { opacity: 0; transform: translate(0,0) scale(.82); } 18% { opacity: .85; } 62% { opacity: .94; transform: translate(116px,-72px) scale(.99); } 100% { opacity: 0; transform: translate(138px,-86px) scale(.92); } }
@keyframes cardFlowD { 0% { opacity: 0; transform: translate(0,0) scale(.82); } 18% { opacity: .85; } 62% { opacity: .94; transform: translate(-116px,-78px) scale(.99); } 100% { opacity: 0; transform: translate(-138px,-90px) scale(.92); } }
@keyframes ringPulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.92); } 30% { opacity: .18; } 60% { opacity: .26; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.10); } }
@keyframes orbMove1 { 0% { opacity: 0; transform: translate(0,0) scale(.55); } 18% { opacity: 1; } 62% { opacity: 1; transform: translate(120px,70px) scale(1); } 100% { opacity: 0; transform: translate(138px,84px) scale(.72); } }
@keyframes orbMove2 { 0% { opacity: 0; transform: translate(0,0) scale(.55); } 18% { opacity: 1; } 62% { opacity: 1; transform: translate(-120px,72px) scale(1); } 100% { opacity: 0; transform: translate(-138px,86px) scale(.72); } }
@keyframes orbMove3 { 0% { opacity: 0; transform: translate(0,0) scale(.55); } 18% { opacity: 1; } 62% { opacity: 1; transform: translate(86px,-112px) scale(1); } 100% { opacity: 0; transform: translate(102px,-126px) scale(.72); } }
@keyframes orbMove4 { 0% { opacity: 0; transform: translate(0,0) scale(.55); } 18% { opacity: 1; } 62% { opacity: 1; transform: translate(-90px,-108px) scale(1); } 100% { opacity: 0; transform: translate(-106px,-124px) scale(.72); } }
@keyframes readyPulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.84); } 34% { opacity: .22; } 66% { opacity: .30; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.16); } }
@media (max-width: 860px) { .status-chip { top: 20px; } .replay-btn { right: 18px; bottom: 18px; } .center-shell { width: 220px; height: 220px; } .mascot { width: 188px; } .copy { top: calc(50% + 132px); width: 86vw; } .title { font-size: 26px; } .footer-hint { width: 86vw; bottom: 78px; } .card-a { left: 10vw; top: calc(50% - 120px); } .card-b { left: auto; right: 10vw; top: calc(50% - 118px); } .card-c { left: 14vw; top: calc(50% + 82px); } .card-d { left: auto; right: 14vw; top: calc(50% + 86px); } }
</style>
</head>
<body>
<div class="boot-root" id="bootRoot" data-phase="awaken">
  <div class="boot-screen">
    <div class="status-chip" id="statusChip">正在唤醒</div>
    <div class="soft-halo"></div>
    <div class="scene-layer scene-organize" data-scene="organize"><div class="card-node card-a"></div><div class="card-node card-b"></div><div class="card-node card-c"></div><div class="card-node card-d"></div></div>
    <div class="scene-layer scene-memory" data-scene="memory"><div class="memory-ring r1"></div><div class="memory-ring r2"></div><div class="memory-ring r3"></div><div class="memory-orb orb-1"></div><div class="memory-orb orb-2"></div><div class="memory-orb orb-3"></div><div class="memory-orb orb-4"></div></div>
    <div class="scene-layer scene-ready" data-scene="ready"><div class="ready-ring r1"></div><div class="ready-ring r2"></div><div class="ready-ring r3"></div></div>
    <div class="center-shell"><img class="mascot" src="./assets/lume-mascot-transparent.png" alt="Lume mascot" /></div>
    <div class="copy" id="copy"><div class="title" id="title">正在唤醒 Lume</div><div class="subtitle" id="subtitle">像轻轻睁开眼睛一样，让启动更安静，也更有陪伴感。</div><div class="dots"><span></span><span></span><span></span></div></div>
    <div class="footer-hint" id="footerHint">启动页不需要“加载中”，而是让用户感到：Lume 已经在身边。</div>
    <div class="stage-indicator" id="stageIndicator"><span class="active"></span><span></span><span></span><span></span></div>
    <button class="replay-btn" id="replayBtn">重播演示</button>
  </div>
</div>
<script>
const phases=[
{key:'awaken',status:'正在唤醒',title:'正在唤醒 Lume',subtitle:'像轻轻睁开眼睛一样，让启动更安静，也更有陪伴感。',hint:'启动页不需要“加载中”，而是让用户感到：Lume 已经在身边。',duration:2600},
{key:'organize',status:'正在整理',title:'正在整理你的工作现场',subtitle:'最近窗口、会话与工作上下文，正在被轻轻整理到位。',hint:'这是最符合 Lume 产品定位的一组动画语言。',duration:3400},
{key:'memory',status:'正在连接记忆',title:'正在连接记忆与当前窗口',subtitle:'历史记忆与此刻的桌面上下文，正在一点点重新连上。',hint:'恢复上下文的阶段，更适合作为启动中段。',duration:3200},
{key:'ready',status:'准备就绪',title:'准备好了',subtitle:'在进入主界面前，给用户一个很轻的“状态完成”确认。',hint:'建议真实产品中停留 300ms - 600ms 后进入主界面。',duration:1900}
];
const root=document.getElementById('bootRoot');
const copy=document.getElementById('copy');
const titleEl=document.getElementById('title');
const subtitleEl=document.getElementById('subtitle');
const footerHint=document.getElementById('footerHint');
const statusChip=document.getElementById('statusChip');
const replayBtn=document.getElementById('replayBtn');
const stageDots=Array.from(document.querySelectorAll('#stageIndicator span'));
const layers=Array.from(document.querySelectorAll('.scene-layer'));
let phaseIndex=0,timer=null,textTimer=null;
function updateIndicator(index){stageDots.forEach((dot,i)=>dot.classList.toggle('active',i===index));}
function updateLayers(phaseKey){layers.forEach(layer=>layer.classList.toggle('active',layer.dataset.scene===phaseKey));}
function renderPhase(index){const phase=phases[index];root.setAttribute('data-phase',phase.key);updateIndicator(index);updateLayers(phase.key);copy.classList.add('is-fading');footerHint.classList.add('is-fading');statusChip.classList.add('is-fading');clearTimeout(textTimer);textTimer=setTimeout(()=>{titleEl.textContent=phase.title;subtitleEl.textContent=phase.subtitle;footerHint.textContent=phase.hint;statusChip.textContent=phase.status;copy.classList.remove('is-fading');footerHint.classList.remove('is-fading');statusChip.classList.remove('is-fading');},260);}
function scheduleNext(){clearTimeout(timer);const phase=phases[phaseIndex];timer=setTimeout(()=>{phaseIndex=(phaseIndex+1)%phases.length;renderPhase(phaseIndex);scheduleNext();},phase.duration);}
function startSequence(reset=true){clearTimeout(timer);clearTimeout(textTimer);if(reset)phaseIndex=0;renderPhase(phaseIndex);scheduleNext();}
replayBtn.addEventListener('click',()=>startSequence(true));
startSequence(true);
</script>
</body>
</html>

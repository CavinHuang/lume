<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 - 顶部较亮，中间有玻璃分割线，底部较暗 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4047"/>
      <stop offset="46%" stop-color="#33363c"/>
      <stop offset="54%" stop-color="#24272c"/>
      <stop offset="100%" stop-color="#191b20"/>
    </linearGradient>

    <!-- 投影滤镜 -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- 裁剪到白色圆形内部 -->
    <clipPath id="circleClip">
      <circle cx="256" cy="222" r="92"/>
    </clipPath>
  </defs>

  <!-- 背景圆角方形 + 阴影 -->
  <rect x="56" y="56" width="400" height="400" rx="78" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 圆形徽章: 白色外描边 + 黑色粗环 + 白色内填充 -->
  <circle cx="256" cy="222" r="115" fill="#111" stroke="white" stroke-width="5"/>
  <circle cx="256" cy="222" r="92" fill="white"/>

  <!-- S 形三线流动图案 (3 层描边叠加 → 外黑/白隙/中黑/白隙/内黑) -->
  <g clip-path="url(#circleClip)">
    <!-- 第1层: 最外黑描边 -->
    <path d="M 195 340 V 185
             C 195 142, 252 128, 286 158
             C 320 188, 318 228, 290 254
             C 262 280, 278 314, 312 340"
          stroke="#111" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- 第2层: 白描边挖出两条白色通道 -->
    <path d="M 195 340 V 185
             C 195 142, 252 128, 286 158
             C 320 188, 318 228, 290 254
             C 262 280, 278 314, 312 340"
          stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- 第3层: 中心黑线 -->
    <path d="M 195 340 V 185
             C 195 142, 252 128, 286 158
             C 320 188, 318 228, 290 254
             C 262 280, 278 314, 312 340"
          stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Lume 文字 -->
  <text x="256" y="413"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="400"
        fill="white" text-anchor="middle" letter-spacing="3">Lume</text>
</svg>

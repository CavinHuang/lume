<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Plugin detail page wireframe</title>
  <desc id="desc">Low fidelity wireframe for an independent plugin detail page with centered content and horizontal tabs.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { stroke: #1f2328; stroke-width: 2; fill: none; }
      .soft { stroke: #9aa0a6; stroke-width: 1.5; fill: none; }
      .fill-soft { fill: #f6f7f8; stroke: #c7cbd1; stroke-width: 1.5; }
      .fill-panel { fill: #fbfbfc; stroke: #d8dbe0; stroke-width: 1.5; }
      .text { fill: #1f2328; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .muted { fill: #6b7178; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .tiny { font-size: 14px; }
      .small { font-size: 18px; }
      .body { font-size: 22px; }
      .title { font-size: 34px; font-weight: 600; }
      .label { font-size: 18px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1100"/>

  <!-- page breadcrumb -->
  <text class="muted small" x="72" y="62">插件</text>
  <path class="soft" d="M128 48 L142 62 L128 76"/>
  <text class="text small" x="168" y="62">Browser</text>

  <!-- centered content column -->
  <g transform="translate(510 110)">
    <!-- header -->
    <rect class="ink" x="8" y="0" width="56" height="56" rx="10"/>
    <circle class="ink" cx="24" cy="16" r="2.5"/>
    <circle class="ink" cx="46" cy="16" r="2.5"/>
    <path class="ink" d="M38 34 L72 44 L56 54 L51 78 L38 34"/>

    <text class="text title" x="0" y="134">Browser</text>
    <text class="muted body" x="0" y="166">Control the in-app browser with Codex</text>

    <circle class="muted" cx="704" cy="132" r="2.5"/>
    <circle class="muted" cx="716" cy="132" r="2.5"/>
    <circle class="muted" cx="728" cy="132" r="2.5"/>
    <rect class="ink" x="760" y="111" width="152" height="42" rx="10"/>
    <text class="text small" x="790" y="138">在对话中试用</text>

    <!-- hero/banner -->
    <rect class="fill-soft" x="0" y="220" width="920" height="130" rx="18"/>
    <rect class="fill-panel" x="252" y="260" width="418" height="54" rx="18"/>
    <rect class="soft" x="270" y="275" width="18" height="14" rx="3"/>
    <text class="text small" x="300" y="294">Browser</text>
    <text class="muted small" x="380" y="294">Test my checkout flow on localhost</text>
    <circle class="fill-soft" cx="644" cy="286" r="20"/>
    <path class="ink" d="M637 286 H651 M646 280 L652 286 L646 292"/>

    <!-- summary strip -->
    <text class="muted small" x="0" y="405">Source: Installed plugin</text>
    <text class="muted small" x="210" y="405">Version: 26.623.101652</text>
    <text class="muted small" x="480" y="405">Capabilities: Interactive, Read, Write</text>

    <!-- tabs -->
    <line class="soft" x1="0" y1="465" x2="920" y2="465"/>
    <text class="text label" x="0" y="446">README</text>
    <text class="muted label" x="126" y="446">Setup</text>
    <text class="muted label" x="232" y="446">权限</text>
    <text class="muted label" x="330" y="446">诊断</text>
    <line class="ink" x1="0" y1="465" x2="84" y2="465"/>

    <!-- active README tab content -->
    <text class="text label" x="0" y="535">Browser</text>
    <line class="soft" x1="0" y1="570" x2="700" y2="570"/>
    <line class="soft" x1="0" y1="605" x2="860" y2="605"/>
    <line class="soft" x1="0" y1="640" x2="820" y2="640"/>

    <rect class="fill-panel" x="0" y="690" width="920" height="120" rx="10"/>
    <text class="text small" x="28" y="730">Usage example</text>
    <line class="soft" x1="28" y1="760" x2="650" y2="760"/>
    <line class="soft" x1="28" y1="790" x2="560" y2="790"/>

    <text class="text label" x="0" y="875">技能</text>
    <rect class="fill-panel" x="0" y="910" width="920" height="78" rx="10"/>
    <circle class="soft" cx="32" cy="949" r="12"/>
    <text class="text small" x="66" y="943">Browser</text>
    <text class="muted tiny" x="66" y="970">Open, inspect, click, type, and take screenshots inside Codex.</text>
    <rect class="ink" x="870" y="934" width="34" height="20" rx="10"/>
    <circle class="ink" cx="894" cy="944" r="8"/>
  </g>
</svg>

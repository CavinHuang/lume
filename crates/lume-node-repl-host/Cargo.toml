[package]
name = "lume-node-repl-host"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Rust MCP/process host aligned with Codex node_repl"

[[bin]]
name = "node_repl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
dirs = "6.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.45", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }

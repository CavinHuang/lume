[package]
name = "lume-desktop-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native desktop context and computer-use host for Lume"

[lib]
name = "lume_desktop_host"
path = "src/lib.rs"

[[bin]]
name = "lume_desktop_host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

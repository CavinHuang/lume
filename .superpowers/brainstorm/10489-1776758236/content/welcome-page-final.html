<h2>新会话欢迎页 — 最终设计</h2>
<p class="subtitle">方案 C：输入框优先 + 最近对话 + 下拉工作区/模型选择</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

  <!-- 主视图 -->
  <div class="mockup">
    <div class="mockup-header">欢迎页主视图</div>
    <div class="mockup-body" style="background:var(--bg-secondary);padding:20px;display:flex;justify-content:center;align-items:center;min-height:480px;">
      <div style="width:480px;">
        <!-- Logo -->
        <div style="text-align:center;margin-bottom:20px;">
          <div style="width:44px;height:44px;margin:0 auto 10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:14px;display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 3v18"/><path d="M3 12h18"/><circle cx="12" cy="12" r="2" fill="white"/></svg>
          </div>
          <h2 style="font-size:20px;font-weight:600;color:var(--text-primary);">新会话</h2>
        </div>

        <!-- 大输入框（内嵌配置） -->
        <div style="background:var(--bg-primary);border:2px solid var(--border-color);border-radius:14px;padding:14px;min-height:110px;">
          <div style="font-size:14px;color:var(--text-secondary);margin-bottom:6px;">描述你想完成的任务...</div>
          <div style="border-top:1px solid var(--border-color);margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <!-- 工作区标签 -->
              <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                Lume
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </div>
              <!-- 模型标签 -->
              <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                Claude Sonnet 4
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </div>
              <!-- 附件 -->
              <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                附件
              </div>
            </div>
            <!-- 发送按钮 -->
            <div style="width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="m5 12h14"/><path d="m12 5v14"/></svg>
            </div>
          </div>
        </div>

        <!-- 最近对话 -->
        <div style="margin-top:20px;">
          <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:500;">当前工作区最近对话</div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;transition:background 0.1s;">
              <span style="font-size:12px;color:var(--text-primary);flex:1;">帮我重构 Auth 模块</span>
              <span style="font-size:10px;color:var(--text-secondary);">3分钟前</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;">
              <span style="font-size:12px;color:var(--text-primary);flex:1;">数据库迁移脚本</span>
              <span style="font-size:10px;color:var(--text-secondary);">昨天</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;">
              <span style="font-size:12px;color:var(--text-primary);flex:1;">OAuth 回调处理</span>
              <span style="font-size:10px;color:var(--text-secondary);">3天前</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作区下拉选择器 -->
  <div class="mockup">
    <div class="mockup-header">工作区下拉选择器（点击工作区标签弹出）</div>
    <div class="mockup-body" style="background:var(--bg-secondary);padding:20px;display:flex;justify-content:center;align-items:flex-start;padding-top:40px;min-height:480px;position:relative;">
      <!-- 模拟输入框触发区 -->
      <div style="width:480px;">
        <div style="background:var(--bg-primary);border:2px solid var(--border-color);border-radius:14px;padding:14px;opacity:0.5;">
          <div style="font-size:14px;color:var(--text-secondary);">描述你想完成的任务...</div>
        </div>
        <!-- 下拉弹出 -->
        <div style="position:absolute;left:calc(50% - 240px + 88px);top:80px;width:240px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,0.3);overflow:hidden;">
          <!-- 搜索框 -->
          <div style="padding:8px;border-bottom:1px solid var(--border-color);">
            <div style="display:flex;align-items:center;gap:6px;background:var(--bg-tertiary);border-radius:6px;padding:6px 8px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span style="font-size:12px;color:var(--text-secondary);">搜索工作区...</span>
            </div>
          </div>
          <!-- 工作区列表 -->
          <div style="max-height:160px;overflow:auto;padding:4px;">
            <div style="padding:7px 10px;background:var(--accent-primary);border-radius:6px;margin:2px 0;display:flex;align-items:center;gap:6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
              <span style="font-size:12px;">Lume</span>
              <span style="font-size:10px;opacity:0.6;margin-left:auto;">12 线程</span>
            </div>
            <div style="padding:7px 10px;margin:2px 0;display:flex;align-items:center;gap:6px;border-radius:6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
              <span style="font-size:12px;">Sidecar</span>
              <span style="font-size:10px;opacity:0.6;margin-left:auto;">5 线程</span>
            </div>
            <div style="padding:7px 10px;margin:2px 0;display:flex;align-items:center;gap:6px;border-radius:6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
              <span style="font-size:12px;">Shared Lib</span>
              <span style="font-size:10px;opacity:0.6;margin-left:auto;">3 线程</span>
            </div>
          </div>
          <!-- 底部新建 -->
          <div style="border-top:1px solid var(--border-color);padding:6px;">
            <div style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-secondary);">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              新建工作区
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

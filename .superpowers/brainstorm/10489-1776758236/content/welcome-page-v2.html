<h2>新会话欢迎页 — 修订版</h2>
<p class="subtitle">去掉 Logo/标题，使用问候语文案</p>

<div class="mockup">
  <div class="mockup-header">欢迎页主视图</div>
  <div class="mockup-body" style="background:var(--bg-secondary);padding:20px;display:flex;justify-content:center;align-items:center;min-height:480px;">
    <div style="width:480px;">
      <!-- 问候语文案 -->
      <div style="text-align:center;margin-bottom:24px;">
        <h2 style="font-size:22px;font-weight:600;color:var(--text-primary);">What should we work on in <span style="background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Lume</span>?</h2>

      <!-- 大输入框（内嵌配置） -->
      <div style="background:var(--bg-primary);border:2px solid var(--border-color);border-radius:14px;padding:14px;min-height:110px;">
        <div style="font-size:14px;color:var(--text-secondary);margin-bottom:6px;">描述你想完成的任务...</div>
        <div style="border-top:1px solid var(--border-color);margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
              Lume
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
              Claude Sonnet 4
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <div style="display:flex;align-items:center;gap:4px;background:var(--bg-tertiary);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              附件
            </div>
          </div>
          <div style="width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="m5 12h14"/><path d="m12 5v14"/></svg>
          </div>
        </div>
      </div>

      <!-- 最近对话 -->
      <div style="margin-top:20px;">
        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:500;">最近对话</div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;">
            <span style="font-size:12px;color:var(--text-primary);flex:1;">帮我重构 Auth 模块</span>
            <span style="font-size:10px;color:var(--text-secondary);">3分钟前</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;">
            <span style="font-size:12px;color:var(--text-primary);flex:1;">数据库迁移脚本</span>
            <span style="font-size:10px;color:var(--text-secondary);">昨天</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;">
            <span style="font-size:12px;color:var(--text-primary);flex:1;">OAuth 回调处理</span>
            <span style="font-size:10px;color:var(--text-secondary);">3天前</span>
          </div>
        </div>
      </div>
    </div>
